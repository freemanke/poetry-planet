kind: Deployment
apiVersion: apps/v1
metadata:
  name: poetry-planet
  namespace: poetry-planet
  labels:
    app: poetry-planet
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poetry-planet
      version: v1
  template:
    metadata:
      labels:
        app: poetry-planet
        version: v1
    spec:
      containers:
        - name: poetry-planet
          image: home.freemanke.com:60012/freemanke/poetry-planet:1.0.0
          ports:
            - name: tcp-80
              containerPort: 80
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: ASPNETCORE_ENVIRONMENT 
              value: 'Production'
          resources: {}
          livenessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      serviceAccountName: default
      securityContext: {}
      imagePullSecrets:
        - name: hub-infervision-com
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
