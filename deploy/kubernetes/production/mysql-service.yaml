kind: Service
apiVersion: v1
metadata:
  name: mysql
  namespace: poetry-planet
  labels:
    app: mysql
spec:
  ports:
    - name: http-3306
      protocol: TCP
      port: 3306
      targetPort: 3306
      nodePort: 32754
  selector:
    app: mysql
  clusterIP: 10.233.36.54
  clusterIPs:
    - 10.233.36.54
  type: NodePort
  sessionAffinity: None
  externalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster
